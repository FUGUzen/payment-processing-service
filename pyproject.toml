[project]
name = "payment-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "pydantic==2.11.4",
  "pydantic-settings==2.9.1", "sqlalchemy[asyncio]==2.0.40",
  "asyncpg==0.30.0", "alembic==1.15.2", "faststream[rabbit,cli]==0.5.48",
  "httpx==0.28.1",
]
[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "ruff==0.11.9"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
