x-app: &app
  build: .
  environment:
    API_KEY: ${API_KEY:?Copy .env.example to .env and set API_KEY}
    DATABASE_URL: postgresql+asyncpg://payments:payments@postgres:5432/payments
    RABBITMQ_URL: amqp://payments:payments@rabbitmq:5672/
    WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
    WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-webhook-receiver}
  restart: unless-stopped
  stop_grace_period: 30s
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: payments
      RABBITMQ_DEFAULT_PASS: payments
    ports: ["127.0.0.1:15672:15672"]
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    <<: *app
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, app.healthcheck]
      interval: 2s
      timeout: 5s
      retries: 30
  consumer:
    <<: *app
    command: faststream run app.consumer:app
    depends_on:
      api: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
volumes:
  postgres_data:
  rabbitmq_data:
